            - generic [ref=f54e1241]:
              - generic [ref=f54e1242]: 20,844
              - generic [ref=f54e1243]: Synthetic orders
              - paragraph [ref=f54e1244]: 2025-03-23 to 2026-09-13
          - paragraph [ref=f54e1245]:
            - strong [ref=f54e1246]: 100% of the training set is generated.
            - text: Those orders carry a SYN- prefix and a synthetic channel, they are excluded from revenue reporting, and their out-of-stock days are written to the ledger as synthetic too. Nothing pretends to be a real sale.
        - generic [ref=f54e1247]:
          - heading "Generate or remove" [level=2] [ref=f54e1248]
          - paragraph [ref=f54e1249]: A per-SKU daily forecaster needs months of history. A shop that opened this week does not have it. Generating a season of plausible trading — weekly rhythm, a Diwali peak, replenishment cycles and the stock-outs that come with them — lets the pipeline be built and measured now, and thrown away the moment real trading catches up.
