<!--
  The display serif was never delivered. Every stylesheet sets
  --font-display: 'Fraunces', 'Cormorant Garamond', serif — and neither face was
  requested here, so all 24 headings on every page fell back to the browser's
  generic serif. Measured: a heading in "Cormorant Garamond" rendered at exactly
  the same 938.03px as one in a deliberately non-existent family.

  Archivo Black is dropped: it belonged to an abandoned neo-brutalist direction,
  is referenced by no loaded stylesheet, and was costing a request for nothing.

  Fraunces carries the display voice (variable weight and optical sizing, so
  large headings tighten as they scale); Cormorant Garamond is the lighter serif
  for pull quotes and long-form. Weights are limited to the ones actually used.
-->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Cormorant+Garamond:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
